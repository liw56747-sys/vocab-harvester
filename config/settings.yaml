# vocab-harvester 全局配置

app:
  name: "vocab-harvester"
  log_level: "INFO"
  # data_dir 由环境变量 VOCAB_DATA_DIR 动态决定，不要在此硬编码
  # 打包后: ~/.vocab-harvester/  开发时: ./data/

database:
  # url 由 DatabaseConfig.model_post_init 动态生成，确保路径跟随用户数据目录
  url: ""

# 平台采集配置
crawlers:
  weibo:
    enabled: true
    app_key: ""
    app_secret: ""
    rate_limit: 5          # 每秒最大请求数
    search_queries: []     # 搜索关键词列表

  xiaohongshu:
    enabled: false
    rate_limit: 2
    search_queries: []

  twitter:
    enabled: false
    api_key: ""
    api_secret: ""
    bearer_token: ""
    rate_limit: 10
    search_queries: []

  reddit:
    enabled: false
    rate_limit: 5
    search_queries: []

# 工作流适配器配置
workflow:
  adapter: "mock"            # mock | xingpan（模型配置优先从前端 UI 传入）
  api:
    base_url: ""
    api_key: ""
    workflow_id: ""
    model: ""
    backup_model: ""
    timeout: 300
    poll_interval: 5
    batch_size: 10
  queue:
    type: ""
    url: ""

# 词库配置
vocabulary:
  auto_approve_threshold: 10   # 词频达到此值自动通过审核
  max_context_samples: 5       # 每个词保留的最大上下文例句数
  dedup_similarity: 0.85       # 相似度阈值（0-1），超过则视为同一词

# 调度配置
scheduler:
  enabled: false
  cron: "0 */6 * * *"         # 默认每6小时执行一次
  default_queries: []

scheduled_tasks:
  - name: "日常抓取任务"
    cron: "0 0 * * *"
    platform: "twitter"
    keywords: 
      - "keyword1"
      - "keyword2"
    # 无 task_type 默认为 standard

  - name: "黑词监控任务"
    cron: "0 8 * * *"
    platform: "twitter"
    keywords: 
      - "敏感词1"
      - "敏感词2"
    task_type: "blacklist_extraction"  # 新增类型标识
