# vocab-harvester �� CI/CD Release Pipeline
# Builds Windows installer + macOS DMG, then publishes a GitHub Release.

name: Release

# 统一 Actions 运行名称格式
run-name: "Release ${{ github.ref_name || inputs.version }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3). Leave blank to use tag name.'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.12'

# ����������������������������������������������������������������������������������������������������������������������������������������
# Windows build
# ����������������������������������������������������������������������������������������������������������������������������������������
jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Inject GitHub Token into .env
        shell: pwsh
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_PAT }}" > .env
          echo ".env created with GH_PAT"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Run unit tests
        run: python -m pytest tests/ -x -q -m "not integration"

      - name: Build executable with PyInstaller
        run: pyinstaller build.spec --noconfirm

      # ���� Inno Setup installer ����������������������������������������������������������������������������
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # Refresh PATH so ISCC is discoverable
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Prepare short-path build directory & generate setup.iss
        shell: pwsh
        run: |
          # ���� Derive version string ����
          $tag = "${{ github.ref_name }}"
          $version = if ("${{ inputs.version }}" -ne "") { "${{ inputs.version }}" } else { $tag -replace '^v', '' }
          echo "Version: $version"

          # ���� Copy dist to a short path to avoid MAX_PATH issues ����
          $shortBase = "C:\temp\vh"
          if (Test-Path $shortBase) { Remove-Item -Recurse -Force $shortBase }
          $shortDist  = "$shortBase\vocab-harvester"
          $shortOut   = "$shortBase\installer"
          New-Item -ItemType Directory -Path $shortDist  -Force | Out-Null
          New-Item -ItemType Directory -Path $shortOut   -Force | Out-Null
          Copy-Item -Path "dist\vocab-harvester\*" -Destination $shortDist -Recurse -Force

          # ���� Generate Inno Setup script ����
          $iconPath = (Resolve-Path "icon.ico").Path -replace '\\', '/'
          $sourceDir = $shortDist -replace '\\', '/'
          $outputDir = $shortOut  -replace '\\', '/'

          $iss = @"
          ; Auto-generated by GitHub Actions �� version $version
          #define MyAppName "vocab-harvester"
          #define MyAppVersion "$version"
          #define MyAppPublisher "VocabHarvester"
          #define MyAppExeName "vocab-harvester.exe"
          #define MySourceDir "$sourceDir"

          [Setup]
          AppId={{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          DisableProgramGroupPage=yes
          OutputDir=$outputDir
          OutputBaseFilename=vocab-harvester-$version-setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          SetupIconFile=$iconPath
          UninstallDisplayIcon={app}\{#MyAppExeName}

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "{#MySourceDir}\{#MyAppExeName}"; DestDir: "{app}"; Flags: ignoreversion
          Source: "{#MySourceDir}\_internal\*"; DestDir: "{app}\_internal"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\{cm:UninstallProgram,{#MyAppName}}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent
          "@

          $issPath = "$shortBase\setup.iss"
          $iss | Out-File -Encoding utf8 $issPath
          echo "ISS written to $issPath"

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # Fallback: search PATH
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
            if (-not $iscc) { throw "ISCC.exe not found" }
          }
          & $iscc "C:\temp\vh\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Copy installer to project directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "installer" -Force | Out-Null
          Copy-Item "C:\temp\vh\installer\*.exe" "installer\" -Force
          Get-ChildItem installer\*.exe | ForEach-Object {
            echo "Installer: $($_.Name)  ($([math]::Round($_.Length / 1MB, 1)) MB)"
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/*.exe
          if-no-files-found: error

      - name: Clean up short-path directory
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "C:\temp\vh") { Remove-Item -Recurse -Force "C:\temp\vh" }

  # ������������������������������������������������������������������������������������������������������������������������������������
  # macOS build
  # ������������������������������������������������������������������������������������������������������������������������������������
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14   # Apple Silicon (M1)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Inject GitHub Token into .env
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GH_PAT }}" > .env
          echo ".env created with GH_PAT"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Run unit tests
        run: python -m pytest tests/ -x -q -m "not integration"

      - name: Build .app with PyInstaller
        run: pyinstaller build_mac.spec --noconfirm

      # ���� Icon conversion (.png �� .icns) ��������������������������������������������������������
      # If icon_macos.png exists, regenerate icon.icns via iconutil.
      # Otherwise the committed icon.icns is used as-is.
      - name: Generate .icns from icon_macos.png (if present)
        run: |
          if [ -f "icon_macos.png" ]; then
            echo "Converting icon_macos.png �� icon.icns"
            ICONSET="icon.iconset"
            mkdir -p "$ICONSET"
            sips -z 16 16     icon_macos.png --out "$ICONSET/icon_16x16.png"      > /dev/null
            sips -z 32 32     icon_macos.png --out "$ICONSET/icon_16x16@2x.png"   > /dev/null
            sips -z 32 32     icon_macos.png --out "$ICONSET/icon_32x32.png"      > /dev/null
            sips -z 64 64     icon_macos.png --out "$ICONSET/icon_32x32@2x.png"   > /dev/null
            sips -z 128 128   icon_macos.png --out "$ICONSET/icon_128x128.png"    > /dev/null
            sips -z 256 256   icon_macos.png --out "$ICONSET/icon_128x128@2x.png" > /dev/null
            sips -z 256 256   icon_macos.png --out "$ICONSET/icon_256x256.png"    > /dev/null
            sips -z 512 512   icon_macos.png --out "$ICONSET/icon_256x256@2x.png" > /dev/null
            sips -z 512 512   icon_macos.png --out "$ICONSET/icon_512x512.png"    > /dev/null
            sips -z 1024 1024 icon_macos.png --out "$ICONSET/icon_512x512@2x.png" > /dev/null
            iconutil -c icns "$ICONSET" -o icon.icns
            rm -rf "$ICONSET"
            echo "icon.icns regenerated"
          else
            echo "icon_macos.png not found �� using existing icon.icns"
          fi

      # ���� DMG creation ��������������������������������������������������������������������������������������������
      - name: Create DMG
        run: |
          set -euo pipefail

          # Derive version
          TAG="${{ github.ref_name }}"
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${TAG#v}"
          fi
          echo "Version: $VERSION"

          APP_DIR="dist/vocab-harvester.app"
          DMG_NAME="vocab-harvester-${VERSION}.dmg"
          INSTALLER_DIR="installer"
          mkdir -p "$INSTALLER_DIR"

          # Verify PyInstaller output
          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: $APP_DIR not found"
            ls -la dist/ || true
            exit 1
          fi

          # Stage .app bundle for DMG packaging
          DMG_STAGE_DIR="dmg_staging"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          cp -R "$APP_DIR" "$DMG_STAGE_DIR/"

          # Attempt create-dmg (brew); fall back to hdiutil
          if brew install create-dmg 2>/dev/null; then
            echo "Using create-dmg"
            create-dmg \
              --volname "Vocab Harvester" \
              --volicon "icon.icns" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --app-drop-link 400 180 \
              "$INSTALLER_DIR/$DMG_NAME" \
              "$DMG_STAGE_DIR" \
              || {
                echo "create-dmg failed, falling back to hdiutil"
                hdiutil create -volname "Vocab Harvester" \
                  -srcfolder "$DMG_STAGE_DIR" \
                  -ov -format UDZO \
                  "$INSTALLER_DIR/$DMG_NAME"
              }
          else
            echo "create-dmg unavailable, using hdiutil"
            hdiutil create -volname "Vocab Harvester" \
              -srcfolder "$DMG_STAGE_DIR" \
              -ov -format UDZO \
              "$INSTALLER_DIR/$DMG_NAME"
          fi

          rm -rf "$DMG_STAGE_DIR"

          ls -lh "$INSTALLER_DIR/$DMG_NAME"
          echo "DMG_SIZE=$(du -sh "$INSTALLER_DIR/$DMG_NAME" | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: installer/*.dmg
          if-no-files-found: error

  # ������������������������������������������������������������������������������������������������������������������������������������
  # GitHub Release
  # ������������������������������������������������������������������������������������������������������������������������������������
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于生成 changelog

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts/ -type f | sort
          echo ""

      - name: Derive version string
        id: version
        run: |
          REF="${{ github.ref_name }}"
          INPUT_VER="${{ inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            VER="$INPUT_VER"
            TAG="v${INPUT_VER}"
          else
            VER="${REF#v}"
            TAG="$REF"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "Release version: $VER (tag: $TAG)"

      - name: Extract release summary from commit
        id: summary
        run: |
          # 提取当前 tag 对应的 commit message 第一行作为更新摘要
          TAG="${{ steps.version.outputs.tag }}"
          
          # 获取 tag 对应的 commit message
          COMMIT_MSG=$(git log -1 --pretty=format:%s "$TAG" 2>/dev/null || echo "")
          
          # 如果为空，尝试获取最新的 commit
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG=$(git log -1 --pretty=format:%s 2>/dev/null || echo "版本更新")
          fi
          
          # 移除可能的版本号前缀（如 "v1.5.0: " 或 "feat: "）
          # 保留核心摘要文本
          SUMMARY=$(echo "$COMMIT_MSG" | sed -E 's/^(v[0-9]+\.[0-9]+\.[0-9]+[:：]?\s*)//' | sed -E 's/^(feat|fix|refactor|chore|docs|style|perf|test)[:：]?\s*/\1: /')
          
          # 如果摘要为空或太短，使用默认值
          if [ -z "$SUMMARY" ] || [ ${#SUMMARY} -lt 3 ]; then
            SUMMARY="版本更新"
          fi
          
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "Release summary: $SUMMARY"

      - name: Locate release files
        id: files
        run: |
          WIN_EXE=$(find artifacts/windows-installer -name '*.exe' -print -quit)
          MAC_DMG=$(find artifacts/macos-dmg         -name '*.dmg' -print -quit)

          if [ -z "$WIN_EXE" ]; then echo "ERROR: Windows installer not found"; exit 1; fi
          if [ -z "$MAC_DMG" ]; then echo "ERROR: macOS DMG not found";         exit 1; fi

          echo "win_exe=$WIN_EXE" >> "$GITHUB_OUTPUT"
          echo "mac_dmg=$MAC_DMG" >> "$GITHUB_OUTPUT"
          echo "Windows installer: $WIN_EXE"
          echo "macOS DMG:         $MAC_DMG"

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # 获取上一个 tag 用于 changelog 范围
          PREV_TAG=$(gh release list --limit 2 --json tagName -q '.[1].tagName // ""' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git log --pretty=format:%H --max-count=1 --grep="v${VERSION}" --reverse 2>/dev/null | head -1 || echo "")
          fi

          # 生成动态更新日志（基于 commit 记录）
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges 2>/dev/null || echo "")
          else
            CHANGELOG=$(git log -20 --pretty=format:"- %s" --no-merges 2>/dev/null || echo "")
          fi

          # 如果 changelog 为空，使用 --generate-notes
          if [ -z "$CHANGELOG" ]; then
            echo "No commit log available, will use GitHub auto-generated notes"
            echo "use_auto_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_auto_notes=false" >> "$GITHUB_OUTPUT"
          fi

          # 获取安装包文件名
          WIN_EXE=$(basename "${{ steps.files.outputs.win_exe }}")
          MAC_DMG=$(basename "${{ steps.files.outputs.mac_dmg }}")

          # 拼接完整 Release Body
          cat > /tmp/release_body.md << 'BODY_EOF'
          ## 更新日志

          BODY_EOF

          if [ -n "$CHANGELOG" ]; then
            echo "$CHANGELOG" >> /tmp/release_body.md
          fi

          # 追加静态安装指南模板
          cat >> /tmp/release_body.md << TEMPLATE_EOF

          ---

          ### 安装包

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | macOS | ${MAC_DMG} | 双击打开，拖入 Applications |
          | Windows | ${WIN_EXE} | 双击安装向导 |

          > 如果下载速度慢，可以尝试使用代理或镜像加速。
          TEMPLATE_EOF

          echo "body_file=/tmp/release_body.md" >> "$GITHUB_OUTPUT"
          echo "=== Release body preview ==="
          cat /tmp/release_body.md

      - name: Create GitHub Release & upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SUMMARY="${{ steps.summary.outputs.summary }}"
          WIN_EXE="${{ steps.files.outputs.win_exe }}"
          MAC_DMG="${{ steps.files.outputs.mac_dmg }}"
          USE_AUTO="${{ steps.notes.outputs.use_auto_notes }}"
          BODY_FILE="${{ steps.notes.outputs.body_file }}"

          # 组装 Release 名称：版本号 + 更新摘要
          RELEASE_NAME="${TAG}: ${SUMMARY}"
          echo "Release name: $RELEASE_NAME"

          # Check if release already exists
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, updating notes and uploading assets..."
            if [ "$USE_AUTO" = "true" ]; then
              gh release edit "$TAG" --title "$RELEASE_NAME" --generate-notes --latest
            else
              gh release edit "$TAG" --title "$RELEASE_NAME" --notes-file "$BODY_FILE" --latest
            fi
          else
            echo "Creating release $TAG..."
            if [ "$USE_AUTO" = "true" ]; then
              gh release create "$TAG" \
                --title "$RELEASE_NAME" \
                --generate-notes \
                --latest
            else
              gh release create "$TAG" \
                --title "$RELEASE_NAME" \
                --notes-file "$BODY_FILE" \
                --latest
            fi
          fi

          # Upload assets (clobber overwrites any existing files)
          gh release upload "$TAG" \
            "$WIN_EXE" \
            "$MAC_DMG" \
            --clobber

          echo ""
          echo "Release published: https://github.com/${GH_REPO}/releases/tag/${TAG}"
