name: Windows release diagnosis
on: push
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reproduce cold-start HTTP pressure failure
        shell: pwsh
        run: |
          for ($round = 1; $round -le 30; $round++) {
            Write-Output "Cold-start round $round / 30"
            python -m pytest tests/stress/test_http_service.py -x -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
